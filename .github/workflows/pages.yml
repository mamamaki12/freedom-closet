# main に入った内容を GitHub Pages で公開する（スマホから https://<ユーザー名>.github.io/freedom-closet/ で開ける）。
# はじめて使うときは、リポジトリの Settings → Pages で Source を「GitHub Actions」にする（下の enablement で自動で有効になることもある）。
# 公開されるのはアプリの画面だけ。服の写真や体型の数字は開いた端末の中にだけ保存される。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages はリポジトリ名のパスの下で配信されるので、その分を base に入れる
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
